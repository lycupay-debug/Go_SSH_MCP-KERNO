name: Package source release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  source-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create installer-compatible source archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=kerno-source.tar.gz
          git archive --format=tar.gz --prefix=kerno-source/ "$GITHUB_REF_NAME" -o "$ARCHIVE"
          sha256sum "$ARCHIVE" > SHA256SUMS
          EXPECTED=$(awk '$2 == "kerno-source.tar.gz" {print $1}' SHA256SUMS)
          ACTUAL=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          test -n "$EXPECTED"
          test "$EXPECTED" = "$ACTUAL"
          tar -tzf "$ARCHIVE" | grep -Fx 'kerno-source/go.mod'
          tar -tzf "$ARCHIVE" | grep -Fx 'kerno-source/scripts/install.sh'
      - name: Publish source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" kerno-source.tar.gz SHA256SUMS --title "${GITHUB_REF_NAME}_Remote" --generate-notes
